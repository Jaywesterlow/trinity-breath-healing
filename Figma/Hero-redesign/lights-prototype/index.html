<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero lights prototype</title>
<style>
	:root { --green: #627454; --cream: #faf0e6; }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--green); color: var(--cream); font: 14px/1.4 system-ui, sans-serif; }

	/* Landscape (wider than tall), as Hero.svelte: the image covers the screen, cropped at the
	   sides on 16:9. The SVG uses the image's own coordinates with `slice`, which crops exactly
	   like object-fit: cover, so every light stays pinned to the drawing. */
	.stage { position: relative; height: 100svh; overflow: hidden; }
	.frame, .frame > * { position: absolute; inset: 0; width: 100%; height: 100%; }
	.frame > img { object-fit: cover; }

	/* Portrait (as tall as wide or taller), as Hero.svelte: the 3:4 image sits on top at
	   max(100vw, 58svh) wide, centred, so phones crop its sides; the green continues below. */
	@media (max-aspect-ratio: 1/1) {
		.stage { height: auto; min-height: 100svh; }
		.stage { display: flex; flex-direction: column; }
		.frame { position: relative; inset: auto; left: 50%; width: max(100vw, 58svh); height: auto; aspect-ratio: 1500 / 2009; transform: translateX(-50%); flex-shrink: 0; }
		/* The image's paper runs on to the bottom of the screen instead of stopping at a flat
		   green edge: its own bottom band, mirrored (paper.cjs), at the image's width. */
		.paper { flex: 1 0 auto; align-self: center; width: max(100vw, 58svh); background: url('paper-p.webp') top center / 100% auto repeat-y; }
	}
	@media (min-aspect-ratio: 1/1) { .paper { display: none; } }

	/* Black-backed light layers: screen adds light and never darkens. */
	.fx { mix-blend-mode: screen; pointer-events: none; }

	/* Panel: drag it by its top bar; the button folds it to just the bar. */
	.panel {
		position: fixed; right: 16px; bottom: 16px; width: 300px; max-width: calc(100vw - 32px);
		max-height: calc(100svh - 32px); display: flex; flex-direction: column;
		background: rgb(20 26 18 / 0.85); border-radius: 12px; backdrop-filter: blur(8px); z-index: 10;
	}
	.bar { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 14px; cursor: grab; touch-action: none; user-select: none; }
	.bar:active { cursor: grabbing; }
	.bar span { flex: 1; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.6; }
	.bar button { width: 44px; height: 44px; border: 0; border-radius: 8px; background: rgb(255 255 255 / 0.08); color: var(--cream); font-size: 20px; cursor: pointer; }
	.body { overflow: auto; padding: 0 16px 14px; }
	.panel.folded .body { display: none; }
	.panel h2 { margin: 14px 0 4px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.7; }
	.panel h2:first-child { margin-top: 2px; }
	.panel label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 8px 0; }
	.panel label small { grid-column: 1 / -1; opacity: 0.6; font-size: 12px; }
	.panel input[type='range'] { grid-column: 1 / -1; width: 100%; }
	.panel output { font-variant-numeric: tabular-nums; opacity: 0.8; }
	.panel .row { display: flex; gap: 8px; margin-top: 10px; }
	.panel .row button { flex: 1; padding: 8px; border: 0; border-radius: 6px; background: #8d6346; color: var(--cream); cursor: pointer; }
</style>
</head>
<body>
<div class="stage">
	<div class="frame">
		<img class="base" id="base" alt="" />
		<svg class="fx" id="fx" aria-hidden="true">
			<defs>
				<!-- How a light falls on the lines around it: full at the light, gone at its reach. -->
				<radialGradient id="falloff">
					<stop offset="0" stop-color="#fff" />
					<stop offset="0.3" stop-color="#fff" stop-opacity="0.55" />
					<stop offset="0.7" stop-color="#fff" stop-opacity="0.12" />
					<stop offset="1" stop-color="#fff" stop-opacity="0" />
				</radialGradient>
				<!-- Tree light, as in the first hero: a white-hot centre, a tight warm halo. -->
				<radialGradient id="orb">
					<stop offset="0" stop-color="#ffffff" />
					<stop offset="0.1" stop-color="#ffffff" />
					<stop offset="0.18" stop-color="#ffeab4" stop-opacity="0.9" />
					<stop offset="0.32" stop-color="#f6bd6c" stop-opacity="0.35" />
					<stop offset="0.6" stop-color="#e59a48" stop-opacity="0.08" />
					<stop offset="1" stop-color="#d98a3a" stop-opacity="0" />
				</radialGradient>
				<radialGradient id="bloom-grad">
					<stop offset="0" stop-color="#ffcf86" stop-opacity="0.22" />
					<stop offset="1" stop-color="#ffcf86" stop-opacity="0" />
				</radialGradient>
				<!-- Firefly: smaller and cooler (yellow-green, like the real thing) so it never reads
				     as one of the tree lights. -->
				<radialGradient id="fly">
					<stop offset="0" stop-color="#fbffe8" />
					<stop offset="0.18" stop-color="#e9fbb0" />
					<stop offset="0.45" stop-color="#c8ea7a" stop-opacity="0.3" />
					<stop offset="1" stop-color="#b5dc60" stop-opacity="0" />
				</radialGradient>

				<filter id="line-glow" x="-10%" y="-10%" width="120%" height="120%">
					<feComponentTransfer><feFuncR type="linear" slope="2.6" /><feFuncG type="linear" slope="2" /><feFuncB type="linear" slope="1.2" /></feComponentTransfer>
					<feGaussianBlur stdDeviation="4" />
				</filter>
				<filter id="line-boost">
					<feComponentTransfer><feFuncR type="linear" slope="1.8" /><feFuncG type="linear" slope="1.5" /><feFuncB type="linear" slope="1" /></feComponentTransfer>
				</filter>
				<filter id="streak-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur id="streak-blur" stdDeviation="2.5" /></filter>

				<!-- Everything that lights the gold lines draws its reach here: tree lights,
				     fireflies, the streak's head. -->
				<mask id="light-mask" maskUnits="userSpaceOnUse">
					<g id="reach-layer"></g>
				</mask>
			</defs>

			<!-- The gold lines' response: their own pixels, brightened only where light reaches. -->
			<g id="response" mask="url(#light-mask)">
				<image class="lit" preserveAspectRatio="none" filter="url(#line-glow)" />
				<image class="lit" preserveAspectRatio="none" filter="url(#line-boost)" />
			</g>
			<g id="blooms"></g>
			<g id="orbs"></g>

			<!-- River streak: a line of light along a traced lane. Stacked dashes make a hot head
			     with a fading tail; the soft copy underneath is its glow. -->
			<g id="streak" fill="none" stroke-linecap="round" opacity="0">
				<path class="s-glow" stroke="#ffe2a6" stroke-opacity="0.45" filter="url(#streak-glow)" />
				<path class="s-tail2" stroke="#ffe8b8" stroke-opacity="0.35" />
				<path class="s-tail1" stroke="#fff1d0" stroke-opacity="0.7" />
				<path class="s-head" stroke="#ffffff" />
			</g>
			<g id="lanes-debug" opacity="0" fill="none" stroke-width="2"></g>

			<g id="fly-layer"></g>
		</svg>
	</div>
	<div class="paper"></div>
</div>

<div class="panel" id="panel">
	<div class="bar" id="bar"><span>Drag to move</span><button id="fold" title="Fold panel">–</button></div>
	<div class="body">
		<h2>Lights on the tree</h2>
		<label>Slowest breath (s) <output></output><input id="period" type="range" min="4" max="20" step="0.5" value="11" /></label>
		<label>Light size <output></output><input id="size" type="range" min="10" max="80" step="1" value="34" /></label>
		<label>Light at rest <output></output><input id="rest" type="range" min="0" max="1" step="0.05" value="0.3" /></label>
		<label>Bloom <output></output><input id="bloom" type="range" min="0" max="1.5" step="0.05" value="0.6" /></label>
		<label>Drift <output></output><small>How far each light wanders around its spot</small><input id="drift" type="range" min="0" max="30" step="0.5" value="5" /></label>
		<label>Drift speed <output></output><input id="driftspeed" type="range" min="0.1" max="2" step="0.1" value="0.5" /></label>

		<h2>Gold lines' response</h2>
		<label>Radius <output></output><small>How far from each tree light the gold lines catch its light</small><input id="reach" type="range" min="30" max="300" step="5" value="110" /></label>
		<label>Brightness <output></output><small>How much brighter the lines get where light falls on them (all light sources)</small><input id="strength" type="range" min="0" max="4" step="0.1" value="2" /></label>
		<label>From fireflies <output></output><small>How much a firefly lights the lines it passes (0 = not at all)</small><input id="flylight" type="range" min="0" max="1" step="0.05" value="0.35" /></label>
		<label>Firefly radius <output></output><input id="flyreach" type="range" min="10" max="150" step="5" value="45" /></label>
		<label>From the streak <output></output><small>How much the streak lights the lines around it as it passes</small><input id="streaklight" type="range" min="0" max="1" step="0.05" value="0.6" /></label>
		<label>Streak radius <output></output><input id="streakreach" type="range" min="10" max="200" step="5" value="70" /></label>

		<h2>Fireflies</h2>
		<label>Number <output></output><input id="flies" type="range" min="0" max="20" step="1" value="8" /></label>
		<label>Size <output></output><input id="flysize" type="range" min="3" max="20" step="0.5" value="8" /></label>
		<label>Speed <output></output><input id="flyspeed" type="range" min="0.2" max="3" step="0.1" value="1" /></label>

		<h2>River streaks</h2>
		<label>Every (s, average) <output></output><input id="every" type="range" min="2" max="30" step="1" value="9" /></label>
		<label>Run time (s) <output></output><input id="run" type="range" min="0.4" max="4" step="0.1" value="1.6" /></label>
		<label>Streak length <output></output><input id="len" type="range" min="0.02" max="0.4" step="0.01" value="0.12" /></label>
		<label>Streak thickness <output></output><input id="width" type="range" min="0.4" max="3" step="0.1" value="1" /></label>
		<label>Streak glow <output></output><small>Size and softness of the light around the streak</small><input id="glow" type="range" min="0" max="6" step="0.1" value="1" /></label>
		<div class="row"><button id="fire">Streak now</button><button id="debug">Show lanes</button></div>
	</div>
</div>

<script>
	const $ = (id) => document.getElementById(id);
	const v = (id) => +$(id).value;
	const NS = 'http://www.w3.org/2000/svg';
	const el = (tag, attrs, parent) => {
		const n = document.createElementNS(NS, tag);
		for (const k in attrs) n.setAttribute(k, attrs[k]);
		return parent.appendChild(n);
	};
	const rand = (a, b) => a + Math.random() * (b - a);
	const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
	const TAU = Math.PI * 2;

	// ── Scenes ───────────────────────────────────────────────────────────────────────
	// One per hero image, switched by the same query as Hero.svelte. Coordinates are in each
	// image's own space. `u` scales every size so it keeps its proportion to the tree, which
	// is drawn smaller in the portrait image.
	// Lights: the five of the first hero (hero-a-final.png), like-for-like on each trunk: in the
	// hollow under the left branch, on the trunk's left edge twice, on its right edge, and low
	// inside near the base.
	const SCENES = {
		landscape: {
			w: 2000, h: 848, u: 1, fit: 'xMidYMid slice', base: 'base.webp', lit: 'lit-warm.webp',
			lights: [[1315, 440], [1350, 475], [1415, 500], [1305, 555], [1382, 598]],
			lanes: [
				'M1112 668 C1000 684 860 692 740 700 C680 704 640 712 634 726 C630 744 690 756 728 772 C752 784 748 798 715 805 C670 812 610 815 560 818',
				'M1108 672 C1020 698 900 714 820 728 C780 736 770 756 800 776 C850 800 960 818 1070 852',
				'M1105 676 C1040 710 960 735 900 748 C860 758 860 775 900 790 C960 810 1080 830 1180 850'
			],
			homes: [{ x: [1080, 1620], y: [170, 420] }, { x: [1080, 1620], y: [170, 420] }, { x: [1150, 1550], y: [480, 640] }, { x: [650, 1150], y: [640, 800] }]
		},
		portrait: {
			w: 750, h: 1004.5, u: 0.7, fit: 'none', base: 'base-p.webp', lit: 'lit-warm-p.webp',
			lights: [[412, 372], [446, 400], [482, 422], [408, 468], [452, 505]],
			lanes: [
				'M345 520 C300 527 200 538 110 552 C60 560 28 570 20 580 C14 590 40 598 70 603',
				'M332 535 C280 545 200 555 140 562 C100 568 70 576 75 588 C80 600 120 608 160 612',
				'M322 548 C270 560 200 570 160 578 C130 585 124 596 150 605'
			],
			homes: [{ x: [160, 640], y: [140, 330] }, { x: [160, 640], y: [140, 330] }, { x: [360, 560], y: [360, 540] }, { x: [20, 380], y: [510, 600] }]
		}
	};
	const SPEEDS = [1.0, 0.77, 0.91, 0.68, 0.84], PEAKS = [1.0, 0.8, 0.95, 0.75, 0.9];
	let S, lights = [], flies = [], streakReach;

	function buildScene() {
		S = SCENES[matchMedia('(max-aspect-ratio: 1/1)').matches ? 'portrait' : 'landscape'];
		$('base').src = S.base;
		const fx = $('fx');
		fx.setAttribute('viewBox', `0 0 ${S.w} ${S.h}`);
		fx.setAttribute('preserveAspectRatio', S.fit);
		const m = $('light-mask');
		for (const [k, val] of Object.entries({ x: 0, y: 0, width: S.w, height: S.h })) m.setAttribute(k, val);
		document.querySelectorAll('.lit').forEach((img) => {
			img.setAttribute('href', S.lit); img.setAttribute('width', S.w); img.setAttribute('height', S.h);
		});
		for (const id of ['reach-layer', 'blooms', 'orbs', 'fly-layer', 'lanes-debug']) $(id).replaceChildren();
		lights = S.lights.map(([x, y], i) => ({
			x, y, speed: SPEEDS[i], peak: PEAKS[i], phase: Math.random(),
			// drift: two slow unrelated sines per axis, like the fireflies but much smaller
			fx: [rand(0.05, 0.09), rand(0.12, 0.19)], fy: [rand(0.05, 0.1), rand(0.13, 0.2)],
			px: [rand(0, TAU), rand(0, TAU)], py: [rand(0, TAU), rand(0, TAU)], t: rand(0, 30),
			reach: el('circle', { fill: 'url(#falloff)' }, $('reach-layer')),
			bloom: el('circle', { fill: 'url(#bloom-grad)' }, $('blooms')),
			orb: el('circle', { fill: 'url(#orb)' }, $('orbs'))
		}));
		streakReach = el('circle', { fill: 'url(#falloff)', opacity: 0 }, $('reach-layer'));
		S.lanes.forEach((d, i) => el('path', { d, stroke: ['#f0f', '#0f0', '#0ff'][i] }, $('lanes-debug')));
		flies = [];
		syncFlies();
		lastLane = -1;
	}

	// ── Tree lights ──────────────────────────────────────────────────────────────────
	// Each breathes on its own clock and peaks at its own strength, so the tree never pulses
	// as one, and drifts a little around its spot.
	function drawLights(dt, still) {
		const u = S.u, rest = v('rest'), size = v('size') * u, reach = v('reach') * u, bloom = v('bloom');
		const drift = still ? 0 : v('drift') * u;
		for (const l of lights) {
			l.phase = (l.phase + (dt * l.speed) / v('period')) % 1;
			l.t += dt * v('driftspeed');
			const b = still ? 1 : 0.5 - 0.5 * Math.cos(l.phase * TAU);
			const k = l.peak * (rest + (1 - rest) * b);
			const x = l.x + drift * (0.7 * Math.sin(TAU * l.fx[0] * l.t + l.px[0]) + 0.3 * Math.sin(TAU * l.fx[1] * l.t + l.px[1]));
			const y = l.y + drift * (0.7 * Math.sin(TAU * l.fy[0] * l.t + l.py[0]) + 0.3 * Math.sin(TAU * l.fy[1] * l.t + l.py[1]));
			for (const c of [l.orb, l.bloom, l.reach]) { c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1)); }
			l.orb.setAttribute('r', size * (0.85 + 0.2 * k));
			l.orb.setAttribute('opacity', k);
			l.bloom.setAttribute('r', size * 2.2);
			l.bloom.setAttribute('opacity', k * bloom);
			l.reach.setAttribute('r', reach * (0.8 + 0.3 * k));
			l.reach.setAttribute('opacity', k);
		}
	}

	// Brightness scales how hard the lit lines are pushed (the sharp copy and its halo).
	const SLOPES = { 'line-boost': [0.9, 0.75, 0.5], 'line-glow': [1.3, 1, 0.6] };
	function setStrength() {
		for (const [id, base] of Object.entries(SLOPES))
			document.querySelectorAll('#' + id + ' feComponentTransfer > *')
				.forEach((f, i) => f.setAttribute('slope', base[i] * v('strength')));
	}

	// ── Fireflies ────────────────────────────────────────────────────────────────────
	// Each drifts on two slow, unrelated sine waves per axis around a home point, blinks on its
	// own schedule, and lights the gold lines it passes, faintly.
	function makeFly() {
		const h = S.homes[Math.floor(Math.random() * S.homes.length)];
		return {
			x: rand(...h.x), y: rand(...h.y),
			ax: [rand(15, 45), rand(5, 20)], ay: [rand(10, 30), rand(4, 14)],
			fx: [rand(0.03, 0.08), rand(0.11, 0.2)], fy: [rand(0.04, 0.09), rand(0.13, 0.22)],
			px: [rand(0, TAU), rand(0, TAU)], py: [rand(0, TAU), rand(0, TAU)],
			t: rand(0, 20), state: 'off', until: rand(0, 4),
			reach: el('circle', { fill: 'url(#falloff)', opacity: 0 }, $('reach-layer')),
			node: el('circle', { fill: 'url(#fly)', opacity: 0 }, $('fly-layer'))
		};
	}
	function syncFlies() {
		const n = reduced ? 0 : v('flies');
		while (flies.length < n) flies.push(makeFly());
		while (flies.length > n) { const f = flies.pop(); f.node.remove(); f.reach.remove(); }
	}
	const NEXT = { off: ['in', () => 0.8], in: ['on', () => rand(1.5, 4)], on: ['out', () => 1], out: ['off', () => rand(1.5, 6)] };
	function drawFlies(dt) {
		const u = S.u, size = v('flysize') * u, speed = v('flyspeed'), light = v('flylight'), reach = v('flyreach') * u;
		for (const f of flies) {
			f.t += dt * speed;
			f.until -= dt;
			if (f.until <= 0) { const [s, d] = NEXT[f.state]; f.state = s; f.until = d(); }
			const fade = f.state === 'in' ? 1 - f.until / 0.8 : f.state === 'out' ? f.until : f.state === 'on' ? 1 : 0;
			const o = fade * fade * (3 - 2 * fade);
			const x = f.x + u * (f.ax[0] * Math.sin(TAU * f.fx[0] * f.t + f.px[0]) + f.ax[1] * Math.sin(TAU * f.fx[1] * f.t + f.px[1]));
			const y = f.y + u * (f.ay[0] * Math.sin(TAU * f.fy[0] * f.t + f.py[0]) + f.ay[1] * Math.sin(TAU * f.fy[1] * f.t + f.py[1]));
			for (const c of [f.node, f.reach]) { c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1)); }
			f.node.setAttribute('r', size);
			f.node.setAttribute('opacity', o.toFixed(3));
			f.reach.setAttribute('r', reach);
			f.reach.setAttribute('opacity', (o * light).toFixed(3));
		}
	}

	// ── River streaks ────────────────────────────────────────────────────────────────
	// A streak picks a lane (never the same twice running) and a short dash runs it. Its head
	// also lights the gold lines around it as it passes.
	const sg = $('streak'), parts = [...sg.querySelectorAll('path')];
	// Share of the streak's length each layer covers, measured back from the head; base widths.
	const SHARE = { 's-glow': 0.6, 's-tail2': 1, 's-tail1': 0.55, 's-head': 0.18 };
	const BASE_W = { 's-glow': 7, 's-tail2': 1.2, 's-tail1': 2, 's-head': 2.8 };
	let anims = [], timer, lastLane = -1, run = null;
	function styleStreak() {
		const g = v('glow'), u = S.u;
		for (const p of parts) {
			const c = p.classList[0];
			// glow layer grows with the glow slider; the line layers only with thickness
			p.setAttribute('stroke-width', BASE_W[c] * v('width') * u * (c === 's-glow' ? g : 1));
		}
		$('streak-blur').setAttribute('stdDeviation', 2.5 * g * u);
		parts[0].setAttribute('stroke-opacity', Math.min(0.95, 0.45 * Math.sqrt(g)));
	}
	function streak() {
		let lane;
		do lane = Math.floor(Math.random() * S.lanes.length); while (lane === lastLane);
		lastLane = lane;
		anims.forEach((a) => a.cancel());
		styleStreak();
		const opts = { duration: v('run') * 1000, easing: 'cubic-bezier(0.3, 0, 0.7, 1)', fill: 'forwards' };
		let L, full;
		anims = parts.map((p) => {
			p.setAttribute('d', S.lanes[lane]);
			L = p.getTotalLength();
			full = L * v('len');
			const dash = full * SHARE[p.classList[0]];
			p.style.strokeDasharray = `${dash} ${L * 2}`;
			// All layers share the same head position: offset by the layer's own dash length.
			return p.animate([{ strokeDashoffset: dash }, { strokeDashoffset: dash - L - full }], opts);
		});
		// Fade in at the start and out at the end so the streak never pops.
		const fade = sg.animate([{ opacity: 0 }, { opacity: 1, offset: 0.12 }, { opacity: 1, offset: 0.8 }, { opacity: 0 }], opts);
		anims.push(fade);
		run = { path: parts[3], L, full, move: anims[0], fade };
		schedule();
	}
	function drawStreakLight() {
		if (!run) return;
		const p = run.move.effect.getComputedTiming().progress ?? 1;
		const head = Math.min(run.L, p * (run.L + run.full));
		const pt = run.path.getPointAtLength(head);
		streakReach.setAttribute('cx', pt.x.toFixed(1));
		streakReach.setAttribute('cy', pt.y.toFixed(1));
		streakReach.setAttribute('r', v('streakreach') * S.u);
		streakReach.setAttribute('opacity', (+getComputedStyle(sg).opacity * v('streaklight')).toFixed(3));
	}
	function schedule() {
		clearTimeout(timer);
		timer = setTimeout(streak, v('every') * 1000 * (0.5 + Math.random()));
	}

	// ── Panel: values, drag, fold ────────────────────────────────────────────────────
	for (const input of document.querySelectorAll('.panel input')) {
		const out = input.parentElement.querySelector('output');
		const show = () => (out.value = input.value);
		input.addEventListener('input', show); show();
	}
	$('strength').addEventListener('input', setStrength);
	$('flies').addEventListener('input', syncFlies);
	for (const id of ['glow', 'width']) $(id).addEventListener('input', styleStreak);
	$('every').addEventListener('change', schedule);
	$('fire').onclick = streak;
	$('debug').onclick = () => {
		const d = $('lanes-debug'), on = d.getAttribute('opacity') === '0';
		d.setAttribute('opacity', on ? '1' : '0');
		$('debug').textContent = on ? 'Hide lanes' : 'Show lanes';
	};
	$('fold').onclick = () => {
		const folded = $('panel').classList.toggle('folded');
		$('fold').textContent = folded ? '+' : '–';
	};
	// Drag by the bar (mouse and touch). Kept inside the window.
	{
		const panel = $('panel'), bar = $('bar');
		let start;
		bar.addEventListener('pointerdown', (e) => {
			if (e.target.closest('button')) return;
			const r = panel.getBoundingClientRect();
			start = { x: e.clientX - r.left, y: e.clientY - r.top };
			bar.setPointerCapture(e.pointerId);
		});
		bar.addEventListener('pointermove', (e) => {
			if (!start) return;
			const r = panel.getBoundingClientRect();
			const x = Math.min(innerWidth - r.width, Math.max(0, e.clientX - start.x));
			const y = Math.min(innerHeight - 52, Math.max(0, e.clientY - start.y));
			Object.assign(panel.style, { left: x + 'px', top: y + 'px', right: 'auto', bottom: 'auto' });
		});
		bar.addEventListener('pointerup', () => (start = null));
		bar.addEventListener('pointercancel', () => (start = null));
	}

	// ── Run ──────────────────────────────────────────────────────────────────────────
	buildScene();
	setStrength();
	styleStreak();
	matchMedia('(max-aspect-ratio: 1/1)').addEventListener('change', () => { anims.forEach((a) => a.cancel()); run = null; buildScene(); styleStreak(); });
	if (reduced) {
		const still = () => drawLights(0, true); // lights on, still; no fireflies, no streaks
		still();
		for (const input of document.querySelectorAll('.panel input')) input.addEventListener('input', still);
		matchMedia('(max-aspect-ratio: 1/1)').addEventListener('change', still);
	} else {
		let last = performance.now();
		const frame = (now) => {
			const dt = Math.min(0.1, (now - last) / 1000);
			last = now;
			drawLights(dt);
			drawFlies(dt);
			drawStreakLight();
			requestAnimationFrame(frame);
		};
		requestAnimationFrame(frame);
		setTimeout(streak, 2000);
	}
</script>
</body>
</html>
